spring.application.name=ewallet

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/ewallet_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=ewallet_user
spring.datasource.password=ewallet_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Required environment value. Use at least 32 random bytes for HS256.
jwt.secret=${JWT_SECRET:}
jwt.expiration-seconds=${JWT_EXPIRATION:3600}

frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
mail.development-log-enabled=${MAIL_DEVELOPMENT_LOG_ENABLED:true}
account-token.verification-minutes=${EMAIL_VERIFICATION_MINUTES:1440}
account-token.reset-minutes=${PASSWORD_RESET_MINUTES:30}


